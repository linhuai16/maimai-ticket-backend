<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div id="projectSelectorModal" class="modal-backdrop" hidden th:fragment="selector">
    <div class="modal-card modal-xlarge" role="dialog" aria-modal="true" aria-labelledby="projectSelectorTitle">
        <div class="modal-header">
            <div><p class="modal-eyebrow">PROJECT SELECTOR</p><h3 id="projectSelectorTitle">选择演出项目</h3></div>
            <button class="icon-button" id="projectSelectorClose" type="button" aria-label="关闭">×</button>
        </div>
        <div class="modal-body">
            <form id="projectSelectorFilterForm" class="selector-layout">
                <label class="field compact selector-search-field"><span>关键词</span><input id="projectSelectorKeyword" type="search" placeholder="演出标题" maxlength="100"></label>
                <label class="field compact"><span>项目状态</span><select id="projectSelectorStatus"><option value="">全部状态</option><option value="ON_SALE">在售</option><option value="COMING_SOON">即将开售</option><option value="SOLD_OUT">已售罄</option><option value="OFFLINE">已下架</option></select></label>
                <div class="selector-actions"><button class="button button-primary" type="submit">查询</button><button class="button button-secondary" id="projectSelectorReset" type="button">重置</button></div>
            </form>
            <div class="table-wrap selector-table-wrap">
                <table class="data-table selector-table">
                    <thead><tr><th>项目</th><th>分类</th><th>状态</th><th>场次</th><th class="align-right">选择</th></tr></thead>
                    <tbody id="projectSelectorTableBody"><tr><td colspan="5"><div class="table-empty">正在加载演出项目...</div></td></tr></tbody>
                </table>
            </div>
            <div class="table-footer"><span class="table-meta" id="projectSelectorTotalText">共 0 个项目</span><div id="projectSelectorPagination" class="pagination"></div></div>
        </div>
        <div class="modal-footer modal-footer-split">
            <div id="projectSelectorSelectedText" class="selector-selected-summary">尚未选择项目</div>
            <div class="modal-footer-links">
                <button class="button button-secondary" id="projectSelectorCancel" type="button">取消</button>
                <button class="button button-primary" id="projectSelectorConfirm" type="button" disabled>确认选择</button>
            </div>
        </div>
    </div>
</div>
</body>
</html>
