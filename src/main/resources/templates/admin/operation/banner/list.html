<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/head :: head('Banner管理')}"></head>
<body>
<div class="admin-app">
    <aside th:replace="~{admin/fragments/sidebar :: sidebar(${activeMenu})}"></aside>
    <div class="admin-main">
        <header th:replace="~{admin/fragments/header :: header(${pageTitle}, ${adminUser})}"></header>
        <main class="page-content">
            <section class="page-heading">
                <div><p class="breadcrumb">运营配置 / Banner</p><h2>首页 Banner</h2><p>维护首页轮播图、跳转演出与生效时间，启停状态会立即影响前台展示。</p></div>
                <a class="button button-primary" th:href="@{/admin/operation/banners/new}">＋ 新增 Banner</a>
            </section>
            <section class="panel filter-panel">
                <form id="bannerFilterForm" class="filter-grid operation-filter-grid">
                    <label class="field compact"><span>关键词</span><input id="bannerKeyword" type="search" placeholder="Banner 标题或演出名称" maxlength="100"></label>
                    <label class="field compact"><span>启用状态</span><select id="bannerEnableStatus"><option value="">全部状态</option><option value="ENABLED">已启用</option><option value="DISABLED">已禁用</option></select></label>
                    <div class="filter-actions"><button class="button button-primary" type="submit">查询</button><button class="button button-secondary" id="bannerResetButton" type="button">重置</button></div>
                </form>
            </section>
            <section class="panel table-panel">
                <div class="panel-header table-header"><div><h3>Banner 数据</h3><p id="bannerTotalText">正在读取...</p></div><button class="button button-ghost button-small" id="bannerRefreshButton" type="button">刷新</button></div>
                <div class="table-wrap">
                    <table class="data-table operation-table banner-table">
                        <thead><tr><th>Banner</th><th>跳转目标</th><th>生效时间</th><th>排序</th><th>配置状态</th><th>实际状态</th><th class="align-right">操作</th></tr></thead>
                        <tbody id="bannerTableBody"><tr><td colspan="7"><div class="table-empty">正在加载 Banner 数据...</div></td></tr></tbody>
                    </table>
                </div>
                <div class="table-footer"><label class="page-size-field">每页 <select id="bannerPageSize"><option value="10">10</option><option value="20">20</option><option value="50">50</option></select> 条</label><div id="bannerPagination" class="pagination"></div></div>
            </section>
        </main>
    </div>
</div>
<div th:replace="~{admin/fragments/feedback :: feedback}"></div>
<script th:src="@{/admin/js/common.js}"></script>
<script th:src="@{/admin/js/request.js}"></script>
<script th:src="@{/admin/js/pagination.js}"></script>
<script th:src="@{/admin/js/banner.js}"></script>
</body>
</html>
