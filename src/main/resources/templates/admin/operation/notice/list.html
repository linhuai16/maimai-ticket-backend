<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/head :: head('观演须知')}"></head>
<body>
<div class="admin-app">
    <aside th:replace="~{admin/fragments/sidebar :: sidebar(${activeMenu})}"></aside>
    <div class="admin-main">
        <header th:replace="~{admin/fragments/header :: header(${pageTitle}, ${adminUser})}"></header>
        <main class="page-content">
            <section class="page-heading">
                <div><p class="breadcrumb">运营配置 / 观演须知</p><h2>观演须知管理</h2><p>维护观演须知标题、默认说明和图标。</p></div>
                <div class="heading-actions"><a class="button button-primary" th:href="@{/admin/operation/notices/new}">新增须知</a><a class="button button-secondary" th:href="@{/admin/operation/notices/config}">关联配置</a></div>
            </section>
            <section class="panel filter-panel">
                <form id="noticeFilterForm" class="filter-grid operation-filter-grid">
                    <label class="field compact"><span>关键词</span><input id="noticeKeyword" type="search" placeholder="须知标题或内容" maxlength="100"></label>
                    <div class="filter-actions"><button class="button button-primary" type="submit">查询</button><button class="button button-secondary" id="noticeResetButton" type="button">重置</button></div>
                </form>
            </section>
            <section class="panel table-panel">
                <div class="panel-header table-header"><div><h3>须知字典</h3><p id="noticeTotalText">正在读取...</p></div><button class="button button-ghost button-small" id="noticeRefreshButton" type="button">刷新</button></div>
                <div class="table-wrap"><table class="data-table operation-table"><thead><tr><th>须知</th><th>内容摘要</th><th>项目引用</th><th class="align-right">操作</th></tr></thead><tbody id="noticeTableBody"><tr><td colspan="4"><div class="table-empty">正在加载观演须知...</div></td></tr></tbody></table></div>
            </section>
        </main>
    </div>
</div>
<div th:replace="~{admin/fragments/feedback :: feedback}"></div>
<script th:src="@{/admin/js/common.js}"></script>
<script th:src="@{/admin/js/request.js}"></script>
<script th:src="@{/admin/js/notice-management.js}"></script>
</body>
</html>
