<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/head :: head('订单监控')}"></head>
<body>
<div class="admin-app">
<aside th:replace="~{admin/fragments/sidebar :: sidebar(${activeMenu})}"></aside>
<div class="admin-main">
<header th:replace="~{admin/fragments/header :: header(${pageTitle}, ${adminUser})}"></header>

<main class="page-content ticket-source-page" data-ts-page="orders">
<section class="page-heading"><div><p class="breadcrumb">第三方票源 / 订单监控</p><h2>第三方订单监控</h2><p>自动交易链路负责创建、支付确认和超时取消；管理员只观察桥接状态并在异常时补查/补偿；UNKNOWN_RESULT 只允许补查创建结果，禁止再次创建 Provider 订单。列表查询保持纯读取，不释放库存。</p></div><button class="button button-warning" id="tsExpireDueBtn" type="button">处理到期 WAIT_PAY</button></section>
<section class="panel filter-panel"><form id="tsOrderFilterForm" class="filter-grid"><label class="field compact"><span>Provider</span><select id="tsOrderProvider"></select></label><label class="field compact"><span>桥接状态</span><select id="tsOrderStatus"><option value="">全部</option><option>RESERVED</option><option>PAID</option><option>CANCELED</option><option>EXPIRED</option><option>FAILED</option><option>UNKNOWN_RESULT</option><option>MANUAL_REVIEW</option><option>PAYMENT_CONFIRMING</option><option>CANCELING</option></select></label><label class="field compact"><span>关键词</span><input id="tsOrderKeyword" placeholder="订单号 / providerOrderId / 演出"></label><div class="filter-actions"><button class="button button-primary" type="submit">查询</button></div></form></section>
<section class="panel table-panel"><div class="panel-header"><div><h3>订单监控列表</h3><p id="tsOrdersText"></p></div></div><div class="table-wrap"><table class="data-table ts-order-monitor-table"><thead><tr><th>本地订单</th><th>Provider</th><th>第三方订单</th><th>金额/数量</th><th>本地状态</th><th>桥接状态</th><th>最后操作</th><th>异常</th><th class="align-right">操作</th></tr></thead><tbody id="tsOrdersBody"></tbody></table></div>
<div class="table-footer"><label class="page-size-field">每页 <select id="tsOrderPageSize"><option value="10">10</option><option value="20" selected>20</option><option value="50">50</option></select> 条</label><div id="tsOrderPagination" class="pagination"></div></div></section>
<div class="panel ts-section-gap"><div class="panel-header"><div><h3>订单桥接详情</h3><p>用于排障和人工复核，不作为日常手工创建 Provider 订单的入口。</p></div></div><pre class="ts-json" id="tsOrderResult">点击“详情”查看</pre></div>
</main>
</div></div>
<div th:replace="~{admin/fragments/feedback :: feedback}"></div>
<script th:src="@{/admin/js/common.js(v='b12r5-r2')}"></script>
<script th:src="@{/admin/js/request.js}"></script>
<script th:src="@{/admin/js/pagination.js}"></script>
<script th:src="@{/admin/js/ticket-source-console.js(v='b12r6-width')}"></script>
</body></html>
