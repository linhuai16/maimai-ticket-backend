<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/head :: head('退票 / 退款协同')}"></head>
<body>
<div class="admin-app">
<aside th:replace="~{admin/fragments/sidebar :: sidebar(${activeMenu})}"></aside>
<div class="admin-main">
<header th:replace="~{admin/fragments/header :: header(${pageTitle}, ${adminUser})}"></header>

<main class="page-content ticket-source-page" data-ts-page="refunds">
<section class="page-heading"><div><p class="breadcrumb">第三方票源 / 退票与退款协同</p><h2>供应商售后协同</h2><p>用户退款资金由麦麦支付链路原路退回；本页负责 Provider 侧退票、票码作废、停止发货、库存恢复和售后状态同步。Provider 资金影响进入账期结算，不表示第三方实时向用户付款。PENDING_REVIEW 必须先到退款审核页审批；已向 Provider 提交后才允许“同步供应商售后状态”，异常任务才允许重试。</p></div><button class="button button-secondary" id="tsProcessRefundDue" type="button">手动触发自动售后扫描</button></section>
<section class="panel filter-panel"><form id="tsRefundFilterForm" class="filter-grid"><label class="field compact"><span>桥接状态</span><select id="tsRefundStatus"><option value="">全部</option><option>PENDING_REVIEW</option><option>REQUESTING</option><option>PROCESSING</option><option>RETRY_WAIT</option><option>MANUAL_REVIEW</option><option>SUCCESS</option><option>REJECTED</option><option>FAILED</option></select></label><label class="field compact"><span>条数</span><select id="tsRefundLimit"><option>50</option><option selected>100</option><option>200</option></select></label><div class="filter-actions"><button class="button button-primary" type="submit">刷新</button></div></form></section>
<section class="panel table-panel"><div class="panel-header"><div><h3>退票 / 退款协同记录</h3></div></div><div class="table-wrap"><table class="data-table ts-refund-table"><thead><tr><th>退款/订单</th><th>Provider</th><th>Provider退款</th><th>用户退款</th><th>本地退款</th><th>桥接状态</th><th>重试/人工</th><th>异常</th><th class="align-right">操作</th></tr></thead><tbody id="tsRefundsBody"></tbody></table></div></section>
<div class="panel ts-section-gap"><pre class="ts-json" id="tsRefundResult">点击“详情”查看；具体操作按当前协同状态显示</pre></div>
</main>
</div></div>
<div th:replace="~{admin/fragments/feedback :: feedback}"></div>
<script th:src="@{/admin/js/common.js}"></script>
<script th:src="@{/admin/js/request.js}"></script>
<script th:src="@{/admin/js/ticket-source-console.js(v='b12r6-width')}"></script>
</body></html>
