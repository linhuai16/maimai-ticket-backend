<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{admin/fragments/head :: head('检票管理')}"></head><body>
<div class="admin-app"><aside th:replace="~{admin/fragments/sidebar :: sidebar(${activeMenu})}"></aside><div class="admin-main"><header th:replace="~{admin/fragments/header :: header(${pageTitle}, ${adminUser})}"></header><main class="page-content" id="ticketCheckPage">
<section class="page-heading"><div><p class="breadcrumb">票务管理 / 检票管理</p><h2>检票管理</h2><p>支持票号或二维码内容验票，确认后执行 UNUSED → CHECKED，并查询检票记录。</p></div></section>
<section class="ticket-check-grid"><section class="panel check-console"><div class="panel-header"><div><h3>验票工作台</h3><p>先校验票码，再确认检票。</p></div></div><div class="panel-body"><form id="verifyForm" class="check-input-row"><label class="field"><span>票号 / 二维码内容</span><input id="verifyCode" autocomplete="off" required placeholder="扫描或输入票码"></label><button class="button button-primary" type="submit">验票</button></form><div id="verifyResult" class="verify-result empty">尚未验票</div></div></section>
<section class="panel check-guide"><div class="panel-header"><h3>检票规则</h3></div><div class="panel-body"><ul class="rule-list"><li>订单必须为待使用状态。</li><li>电子票必须为未使用状态。</li><li>重复检票、异常票和失效票会被拦截。</li><li>检票成功后不可在本页面撤销。</li></ul></div></section></section>
<section class="panel filter-panel"><form id="checkRecordFilter" class="filter-grid"><label class="field compact filter-span-two"><span>关键词</span><input id="checkKeyword" type="search" placeholder="票号、订单号、演出、观演人"></label><label class="field compact"><span>项目 ID</span><input id="checkProjectId" type="number" min="1"></label><label class="field compact"><span>场次 ID</span><input id="checkSessionId" type="number" min="1"></label><label class="field compact"><span>检票开始日期</span><input id="checkDateFrom" type="date"></label><label class="field compact"><span>检票结束日期</span><input id="checkDateTo" type="date"></label><div class="filter-actions"><button class="button button-primary" type="submit">查询</button><button class="button button-secondary" id="resetCheckFilter" type="button">重置</button></div></form></section>
<section class="panel table-panel"><div class="panel-header"><div><h3>检票记录</h3><p id="checkTotalText">正在读取...</p></div></div><div class="table-wrap"><table class="data-table"><thead><tr><th>票号 / 订单</th><th>演出 / 场次</th><th>观演人 / 座位</th><th>检票时间</th><th class="align-right">查看</th></tr></thead><tbody id="checkTableBody"><tr><td colspan="5"><div class="table-empty">正在加载...</div></td></tr></tbody></table></div><div class="table-footer"><label class="page-size-field">每页 <select id="checkPageSize"><option>10</option><option selected>20</option><option>50</option></select> 条</label><div id="checkPagination" class="pagination"></div></div></section>
</main></div></div><div th:replace="~{admin/fragments/feedback :: feedback}"></div><script th:src="@{/admin/js/common.js}"></script><script th:src="@{/admin/js/request.js}"></script><script th:src="@{/admin/js/pagination.js}"></script><script th:src="@{/admin/js/ticket-check.js}"></script>
</body></html>
