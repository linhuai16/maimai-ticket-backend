<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{admin/fragments/head :: head('出票异常处理')}"></head><body>
<div class="admin-app"><aside th:replace="~{admin/fragments/sidebar :: sidebar(${activeMenu})}"></aside><div class="admin-main"><header th:replace="~{admin/fragments/header :: header(${pageTitle}, ${adminUser})}"></header><main class="page-content" id="issueErrorPage">
<section class="page-heading"><div><p class="breadcrumb">票务管理 / 出票异常处理</p><h2>出票异常处理</h2><p>集中处理 ERROR 状态电子票，可单票重试或重试订单中的全部 ERROR 电子票；系统退款按订单全额处理，不支持按观演人退款。</p></div><button class="button button-ghost" id="refreshErrorButton" type="button">刷新数据</button></section>
<section class="panel filter-panel"><form id="errorFilterForm" class="filter-grid"><label class="field compact filter-span-two"><span>关键词</span><input id="errorKeyword" type="search" placeholder="票号、订单号、演出、观演人"></label><label class="field compact"><span>订单 ID</span><input id="errorOrderId" type="number" min="1"></label><label class="field compact"><span>项目 ID</span><input id="errorProjectId" type="number" min="1"></label><label class="field compact"><span>电子票创建开始</span><input id="errorDateFrom" type="date"></label><label class="field compact"><span>电子票创建结束</span><input id="errorDateTo" type="date"></label><div class="filter-actions"><button class="button button-primary" type="submit">查询</button><button class="button button-secondary" id="resetErrorFilter" type="button">重置</button></div></form></section>
<section class="panel table-panel"><div class="panel-header"><div><h3>异常电子票</h3><p id="errorTotalText">正在读取...</p></div></div><div class="table-wrap"><table class="data-table"><thead><tr><th>电子票 / 订单</th><th>演出 / 场次</th><th>观演人</th><th>异常原因</th><th>更新时间</th><th class="align-right">处理</th></tr></thead><tbody id="errorTableBody"><tr><td colspan="6"><div class="table-empty">正在加载...</div></td></tr></tbody></table></div><div class="table-footer"><label class="page-size-field">每页 <select id="errorPageSize"><option>10</option><option selected>20</option><option>50</option></select> 条</label><div id="errorPagination" class="pagination"></div></div></section>
</main></div></div>
<div id="errorRefundModal" class="modal-backdrop" hidden><div class="modal-card modal-small"><form id="errorRefundForm"><div class="modal-header"><h3>出票失败整单系统退款</h3><button class="icon-button" data-close-modal="errorRefundModal" type="button">×</button></div><div class="modal-body"><div class="inline-alert warning">此操作以订单为单位：即使只有一个观演人的电子票异常，也会使该订单全部未检票电子票失效、创建整单全额退款记录并把订单改为退款成功。</div><input id="refundOrderId" type="hidden"><label class="field"><span>退款原因</span><textarea id="refundReason" maxlength="255" rows="4" required></textarea></label></div><div class="modal-footer"><button class="button button-secondary" data-close-modal="errorRefundModal" type="button">取消</button><button class="button button-primary" type="submit">确认整单退款</button></div></form></div></div>
<div th:replace="~{admin/fragments/feedback :: feedback}"></div><script th:src="@{/admin/js/common.js}"></script><script th:src="@{/admin/js/request.js}"></script><script th:src="@{/admin/js/pagination.js}"></script><script th:src="@{/admin/js/issue-error.js}"></script>
</body></html>
