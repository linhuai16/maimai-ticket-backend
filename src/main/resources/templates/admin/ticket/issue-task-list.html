<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{admin/fragments/head :: head('出票任务')}"></head><body>
<div class="admin-app"><aside th:replace="~{admin/fragments/sidebar :: sidebar(${activeMenu})}"></aside><div class="admin-main"><header th:replace="~{admin/fragments/header :: header(${pageTitle}, ${adminUser})}"></header><main class="page-content" id="issueTaskPage">
<section class="page-heading"><div><p class="breadcrumb">票务管理 / 出票任务</p><h2>出票任务</h2><p>按订单聚合电子票生成状态，订单状态按全部电子票聚合；任一电子票为 ERROR 时订单显示异常。可仅重试异常票，出票失败退款始终按整单全额处理。</p></div><button class="button button-ghost" id="refreshIssueButton" type="button">刷新数据</button></section>
<section class="panel filter-panel"><form id="issueFilterForm" class="filter-grid ticket-filter-grid"><label class="field compact filter-span-two"><span>关键词</span><input id="issueKeyword" type="search" placeholder="订单号、演出、场次、场馆"></label><label class="field compact"><span>任务状态</span><select id="issueStatus"><option value="">全部状态</option><option value="GENERATING">生成中</option><option value="ERROR">异常</option><option value="PARTIAL">部分完成</option><option value="ISSUED">已出票</option><option value="NO_TICKET">无电子票</option></select></label><label class="field compact"><span>项目 ID</span><input id="issueProjectId" type="number" min="1"></label><label class="field compact"><span>场次 ID</span><input id="issueSessionId" type="number" min="1"></label><label class="field compact"><span>开始日期</span><input id="issueDateFrom" type="date"></label><label class="field compact"><span>结束日期</span><input id="issueDateTo" type="date"></label><div class="filter-actions"><button class="button button-primary" type="submit">查询</button><button class="button button-secondary" id="resetIssueFilter" type="button">重置</button></div></form></section>
<section class="panel table-panel"><div class="panel-header"><div><h3>出票任务数据</h3><p id="issueTotalText">正在读取...</p></div></div><div class="table-wrap"><table class="data-table"><thead><tr><th>订单</th><th>演出 / 场次</th><th>票数统计</th><th>任务状态</th><th>更新时间</th><th class="align-right">操作</th></tr></thead><tbody id="issueTableBody"><tr><td colspan="6"><div class="table-empty">正在加载...</div></td></tr></tbody></table></div><div class="table-footer"><label class="page-size-field">每页 <select id="issuePageSize"><option>10</option><option selected>20</option><option>50</option></select> 条</label><div id="issuePagination" class="pagination"></div></div></section>
</main></div></div>
<div id="issueDetailModal" class="modal-backdrop" hidden><div class="modal-card modal-xlarge"><div class="modal-header"><div><p class="modal-eyebrow">ISSUE TASK DETAIL</p><h3>出票任务详情</h3></div><button class="icon-button" data-close-modal="issueDetailModal" type="button">×</button></div><div class="modal-body" id="issueDetailContent"></div><div class="modal-footer"><button class="button button-secondary" data-close-modal="issueDetailModal" type="button">关闭</button></div></div></div>
<div id="issueReasonModal" class="modal-backdrop" hidden><div class="modal-card modal-small"><form id="issueReasonForm"><div class="modal-header"><h3 id="issueReasonTitle">填写原因</h3><button class="icon-button" data-close-modal="issueReasonModal" type="button">×</button></div><div class="modal-body"><input id="issueReasonOrderId" type="hidden"><input id="issueReasonAction" type="hidden"><label class="field"><span>原因</span><textarea id="issueReason" maxlength="500" rows="4" required></textarea></label></div><div class="modal-footer"><button class="button button-secondary" data-close-modal="issueReasonModal" type="button">取消</button><button class="button button-primary" type="submit">确认</button></div></form></div></div>
<div th:replace="~{admin/fragments/feedback :: feedback}"></div><script th:src="@{/admin/js/common.js}"></script><script th:src="@{/admin/js/request.js}"></script><script th:src="@{/admin/js/pagination.js}"></script><script th:src="@{/admin/js/issue-task.js}"></script>
</body></html>
