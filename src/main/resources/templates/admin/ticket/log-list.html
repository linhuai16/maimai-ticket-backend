<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{admin/fragments/head :: head(${pageTitle})}"></head><body>
<div class="admin-app"><aside th:replace="~{admin/fragments/sidebar :: sidebar(${activeMenu})}"></aside><div class="admin-main"><header th:replace="~{admin/fragments/header :: header(${pageTitle}, ${adminUser})}"></header><main class="page-content" id="ticketLogPage" th:attr="data-log-view=${logView}">
<section class="page-heading"><div><p class="breadcrumb" th:text="${logView == 'ISSUE' ? '票务管理 / 出票日志' : '票务管理 / 操作日志'}"></p><h2 th:text="${pageTitle}"></h2><p th:text="${logView == 'ISSUE' ? '按 business_type=ISSUE 展示系统和管理员的出票业务轨迹。' : '按 operator_type=ADMIN 展示管理员票务操作审计记录。'}"></p></div><button class="button button-ghost" id="refreshLogButton" type="button">刷新数据</button></section>
<section class="panel filter-panel"><form id="logFilterForm" class="filter-grid ticket-log-filter"><label class="field compact filter-span-two"><span>关键词</span><input id="logKeyword" type="search" placeholder="日志号、订单号、票号、演出、说明"></label><label class="field compact" id="logBusinessField"><span>业务类型</span><select id="logBusinessType"><option value="">全部业务</option><option value="TICKET">电子票</option><option value="ISSUE">出票</option><option value="CHECK">检票</option><option value="QR">二维码</option><option value="REFUND">退款</option></select></label><label class="field compact" id="logOperatorField"><span>执行者类型</span><select id="logOperatorType"><option value="">全部执行者</option><option value="SYSTEM">系统</option><option value="ADMIN">管理员</option></select></label><label class="field compact"><span>动作类型</span><input id="logActionType" placeholder="如 RETRY_TICKET"></label><label class="field compact"><span>结果</span><select id="logResultStatus"><option value="">全部结果</option><option value="SUCCESS">成功</option><option value="FAILED">失败</option></select></label><label class="field compact"><span>订单 ID</span><input id="logOrderId" type="number" min="1"></label><label class="field compact"><span>电子票 ID</span><input id="logTicketId" type="number" min="1"></label><label class="field compact"><span>开始日期</span><input id="logDateFrom" type="date"></label><label class="field compact"><span>结束日期</span><input id="logDateTo" type="date"></label><div class="filter-actions"><button class="button button-primary" type="submit">查询</button><button class="button button-secondary" id="resetLogFilter" type="button">重置</button></div></form></section>
<section class="panel table-panel"><div class="panel-header"><div><h3 th:text="${pageTitle + '数据'}"></h3><p id="logTotalText">正在读取...</p></div></div><div class="table-wrap"><table class="data-table ticket-log-data-table"><thead><tr><th>发生时间</th><th>业务 / 动作</th><th>目标</th><th>执行者</th><th>状态变化</th><th>结果</th><th>说明</th><th class="align-right">详情</th></tr></thead><tbody id="logTableBody"><tr><td colspan="8"><div class="table-empty">正在加载...</div></td></tr></tbody></table></div><div class="table-footer"><label class="page-size-field">每页 <select id="logPageSize"><option>10</option><option selected>20</option><option>50</option></select> 条</label><div id="logPagination" class="pagination"></div></div></section>
</main></div></div>
<div id="logDetailModal" class="modal-backdrop" hidden><div class="modal-card modal-large"><div class="modal-header"><div><p class="modal-eyebrow">LOG DETAIL</p><h3>票务日志详情</h3></div><button class="icon-button" data-close-modal="logDetailModal" type="button">×</button></div><div class="modal-body" id="logDetailContent"></div><div class="modal-footer"><button class="button button-secondary" data-close-modal="logDetailModal" type="button">关闭</button></div></div></div>
<div th:replace="~{admin/fragments/feedback :: feedback}"></div><script th:src="@{/admin/js/common.js}"></script><script th:src="@{/admin/js/request.js}"></script><script th:src="@{/admin/js/pagination.js}"></script><script th:src="@{/admin/js/ticket-log.js}"></script>
</body></html>
